<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - Broderies Fait Main</title>
    <style>
        :root {
            --primary-color: #4a5d4e;
            --bg-color: #fcfbf9;
            --text-color: #2c2c2c;
            --accent-color: #d4a373;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: white;
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
        }
        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        header p {
            color: #666;
            margin-top: 0.5rem;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .admin-section {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .admin-section h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-top: 0;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #f0f0f0;
        }
        .product-info {
            padding: 1.5rem;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }
        .product-price {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover {
            opacity: 0.9;
        }
        form input, form textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>Le Temps Retrouvé - Broderies</h1>
        <p>Cadres et plateaux faits maison, brodés avec passion</p>
    </header>

    <div class="container">
        
        <!-- Section pour ajouter un produit (Connectée à Supabase) -->
        <div class="admin-section">
            <h2>Espace d'administration (Ajouter une création)</h2>
            <form id="product-form">
                <input type="text" id="title" placeholder="Nom de la création (ex: Cadre Fleurs Sauvages)" required>
                <input type="number" id="price" placeholder="Prix en €" step="0.01" required>
                <input type="file" id="image-file" accept="image/*" required>
                <button type="submit" class="btn">Publier sur la boutique</button>
            </form>
        </div>

        <!-- Catalogue des produits -->
        <h2>Nos Créations</h2>
        <div class="products-grid" id="products-container">
            <!-- Les produits s'afficheront ici automatiquement -->
            <p>Chargement des créations...</p>
        </div>

    </div>

    <!-- Intégration de Supabase (pour la base de données et les images) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Vos clés Supabase (à configurer à l'étape suivante)
        const SUPABASE_URL = 'https://mdwgxwcibmofuuwzavbc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_JGNEcRzpm2Ped5wzcVynzQ_qQ_WWgos';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProducts() {
            const container = document.getElementById('products-container');
            const { data, error } = await supabaseClient.from('products').select('*');
            
            if (error) {
                container.innerHTML = '<p>Erreur lors du chargement des produits.</p>';
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p>Aucune création pour le moment. Utilisez le formulaire ci-dessus pour en ajouter !</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${product.image_url}" alt="${product.title}" class="product-image">
                        <div class="product-info">
                            <h3 class="product-title">${product.title}</h3>
                            <div class="product-price">${product.price} €</div>
                            <button class="btn" onclick="alert('Redirection vers le paiement Stripe pour : ${product.title}')">Acheter</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const price = parseFloat(document.getElementById('price').value);
            const fileInput = document.getElementById('image-file');
            const file = fileInput.files[0];

            if (!file) return alert('Veuillez choisir une image');

            // 1. Upload de l'image sur Supabase Storage
            const fileName = Date.now() + '-' + file.name;
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('images')
                .upload(fileName, file);

            if (uploadError) {
                alert('Erreur lors de l\'upload de l\'image');
                return;
            }

            // Récupérer l'URL publique de l'image
            const { data: { publicUrl } } = supabaseClient.storage
                .from('images')
                .getPublicUrl(fileName);

            // 2. Enregistrement du produit dans la base de données Supabase
            const { error: dbError } = await supabaseClient
                .from('products')
                .insert([{ title, price, image_url: publicUrl }]);

            if (dbError) {
                alert('Erreur lors de l\'enregistrement du produit');
            } else {
                alert('Création ajoutée avec succès !');
                location.reload();
            }
        });

        // Charger les produits au démarrage
        loadProducts();
    </script>
</body>
</html>
